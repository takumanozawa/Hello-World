# Alembic 設定ファイル

[alembic]
# マイグレーションスクリプトのディレクトリ
script_location = alembic

# データベース接続（env.pyで上書き）
sqlalchemy.url = postgresql://ict_user:ict_password_2026@localhost:5432/ict_construction

# ロギング設定
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
